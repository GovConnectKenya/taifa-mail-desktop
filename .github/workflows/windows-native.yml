name: Windows native

# Build check of the native WinUI 3 client in windows/. This is a branch check, never a release: nothing is
# signed, tagged or published, and the artifacts are unsigned builds for inspection only.
# Test and UI smoke steps are switched off for now (owner instruction); the test projects still build.

on:
  push:
    branches: [feat/native-windows]
    paths: ['windows/**', 'docs/native/**', '.github/workflows/windows-native.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    working-directory: windows

jobs:
  core:
    name: Core library build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build core and its test project (tests are not run)
        run: dotnet build tests/TaifaMail.Core.Tests -c Release

  build:
    name: Build Release ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Release (unsigned, self contained, unpackaged)
        run: >
          dotnet publish src/TaifaMail.App/TaifaMail.App.csproj -c Release -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }} -p:PublishReadyToRun=false --self-contained true -o artifacts/publish-${{ matrix.rid }}
      - name: Show XAML compiler diagnostics
        if: failure()
        run: |
          Get-ChildItem -Recurse src/TaifaMail.App/obj -Filter output.json | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Raw }
          $in = Get-ChildItem -Recurse src/TaifaMail.App/obj -Filter input.json | Select-Object -First 1
          if ($in) {
            $xc = Get-ChildItem "$env:USERPROFILE/.nuget/packages/microsoft.windowsappsdk/1.8.260921001/tools/net472" -Filter XamlCompiler.exe | Select-Object -First 1
            $json = Get-Content $in.FullName -Raw | ConvertFrom-Json
            "== input.json properties"
            $json.PSObject.Properties | ForEach-Object { $v = $_.Value; $t = if ($v -is [array]) { "array[$($v.Count)]" } else { "$v" }; "{0} = {1}" -f $_.Name, ($t.Substring(0, [Math]::Min(160, $t.Length))) }
            function Try-Run($label, $obj) {
              $obj | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $in.DirectoryName 'bisect-input.json')
              Remove-Item (Join-Path $in.DirectoryName 'bisect-output.json') -ErrorAction SilentlyContinue
              $out = & $xc.FullName (Join-Path $in.DirectoryName 'bisect-input.json') (Join-Path $in.DirectoryName 'bisect-output.json') 2>&1 | Out-String
              "{0} -> exit {1}; stdout: [{2}]; output.json exists: {3}" -f $label, $LASTEXITCODE, $out.Trim(), (Test-Path (Join-Path $in.DirectoryName 'bisect-output.json'))
            }
            $e = $json | ConvertTo-Json -Depth 20 | ConvertFrom-Json; $e.XamlPages = @(); $e.XamlApplications = @(); $e.ReferenceAssemblies = @(); Try-Run 'nothing, no references' $e
            $e = $json | ConvertTo-Json -Depth 20 | ConvertFrom-Json; $e.XamlPages = @(); $e.XamlApplications = @(); $e.ReferenceAssemblies = @($json.ReferenceAssemblies | Where-Object { $_.ItemSpec -notlike '*TaifaMail*' -and $_.ItemSpec -notlike '*Toolkit*' }); Try-Run 'nothing, without our assemblies' $e
            "== no arguments"
            & $xc.FullName 2>&1 | Out-String | Write-Host
            "exit $LASTEXITCODE"
            "== application event log, last 15 minutes"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'XamlCompiler|Markup' } | Select-Object -First 4 | ForEach-Object { $_.Message.Substring(0, [Math]::Min(1800, $_.Message.Length)) }
            "== references sample"
            $json.ReferenceAssemblies | Select-Object -First 3 | ForEach-Object { $_.ItemSpec }
            "== dotnet and msbuild"
            dotnet --version
            Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          } else { "no input.json found" }
      - name: Prove preview data is not in Release
        run: |
          $dll = Get-ChildItem artifacts/publish-${{ matrix.rid }} -Filter TaifaMail.dll | Select-Object -First 1
          $bytes = [IO.File]::ReadAllBytes($dll.FullName)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $utf16 = [Text.Encoding]::Unicode.GetString($bytes)
          $utf16b = [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 2)
          $hits = @()
          foreach ($needle in 'PreviewBoot', 'PreviewData', 'PreviewMail', 'PreviewAuth') { if ($ascii.Contains($needle)) { $hits += $needle } }
          foreach ($needle in 'TAIFA_PREVIEW_FIXTURE_ONLY_DEBUG', '--preview-data', '--screenshots') { if ($utf16.Contains($needle) -or $utf16b.Contains($needle)) { $hits += $needle } }
          if ($hits.Count -gt 0) { Write-Error "Preview data found in the Release build: $($hits -join ', ')"; exit 1 }
          Write-Host "Release assembly $($dll.Name) ($($dll.Length) bytes) contains none of the preview markers."
      - name: Check fonts, logos and icon ship in the output
        run: |
          $dir = 'artifacts/publish-${{ matrix.rid }}'
          $need = @('Assets/Fonts/GoogleSans-Regular.ttf','Assets/Fonts/GoogleSans-Medium.ttf','Assets/Fonts/GoogleSans-SemiBold.ttf','Assets/Fonts/JetBrainsMono-Regular.ttf','Assets/Fonts/JetBrainsMono-Medium.ttf','Assets/Fonts/JetBrainsMono-SemiBold.ttf','Assets/Fonts/OFL.txt','Assets/Logo/taifa_logo.svg','Assets/Logo/taifa_logo_white.svg','Assets/taifa.ico')
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { Write-Error "Missing from the output: $($missing -join ', ')"; exit 1 }
          Write-Host "All $($need.Count) asset files are in $dir."
      - name: Detect signing secrets
        id: signing
        env:
          HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          "signed=$(if ($env:HAS_PFX) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Sign (skipped unless signing secrets exist)
        if: steps.signing.outputs.signed == 'true'
        env:
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1).FullName
          Get-ChildItem artifacts/publish-${{ matrix.rid }} -Include TaifaMail.exe,TaifaMail.dll -Recurse | ForEach-Object {
            & $signtool sign /fd SHA256 /f $pfx /p $env:SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item $pfx -Force
      - name: Zip
        run: |
          $kind = if ('${{ steps.signing.outputs.signed }}' -eq 'true') { 'signed' } else { 'unsigned' }
          Compress-Archive -Path artifacts/publish-${{ matrix.rid }}/* -DestinationPath "artifacts/TaifaMail-windows-${{ matrix.rid }}-$kind.zip"
          "zip=TaifaMail-windows-${{ matrix.rid }}-$kind.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: zip
      - uses: actions/upload-artifact@v4
        with:
          name: TaifaMail-windows-${{ matrix.rid }}-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: windows/artifacts/${{ steps.zip.outputs.zip }}
          retention-days: 14

  debug-build:
    name: Build Debug x64 (preview data compiled in)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Debug x64
        run: dotnet build src/TaifaMail.App/TaifaMail.App.csproj -c Debug -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/debug-x64
      - name: Prove preview data is in Debug
        run: |
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path artifacts/debug-x64/TaifaMail.dll))
          if (-not [Text.Encoding]::ASCII.GetString($bytes).Contains('PreviewBoot')) { Write-Error 'Debug build is missing the preview fixtures'; exit 1 }
          Write-Host 'Debug assembly contains the preview fixtures.'
