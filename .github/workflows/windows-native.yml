name: Windows native

# Build and test of the native WinUI 3 client in windows/. This is a branch
# check, never a release: nothing is signed, tagged or published, and the
# artifacts are unsigned builds for inspection only.

on:
  push:
    branches: [feat/native-windows]
    paths: ['windows/**', 'docs/native/**', '.github/workflows/windows-native.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    working-directory: windows

jobs:
  core:
    name: Core library tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/TaifaMail.Core/TaifaMail.Core.csproj; dotnet restore tests/TaifaMail.Core.Tests/TaifaMail.Core.Tests.csproj
      - name: Test
        run: dotnet test tests/TaifaMail.Core.Tests -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: windows/artifacts/test-results

  build:
    name: Build Release ${{ matrix.platform }}
    runs-on: windows-latest
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Release (unsigned, self contained, unpackaged)
        run: >
          dotnet publish src/TaifaMail.App/TaifaMail.App.csproj -c Release -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }} -p:PublishReadyToRun=false --self-contained true -o artifacts/publish-${{ matrix.rid }}
      - name: Show XAML compiler diagnostics
        if: failure()
        run: |
          Get-ChildItem -Recurse src/TaifaMail.App/obj -Filter output.json | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Raw }
          $in = Get-ChildItem -Recurse src/TaifaMail.App/obj -Filter input.json | Select-Object -First 1
          if ($in) {
            $xc = Get-ChildItem "$env:USERPROFILE/.nuget/packages/microsoft.windowsappsdk/1.6.250108002/tools/net472" -Filter XamlCompiler.exe | Select-Object -First 1
            $json = Get-Content $in.FullName -Raw | ConvertFrom-Json
            "== input.json properties"
            $json.PSObject.Properties | ForEach-Object { $v = $_.Value; $t = if ($v -is [array]) { "array[$($v.Count)]" } else { "$v" }; "{0} = {1}" -f $_.Name, ($t.Substring(0, [Math]::Min(160, $t.Length))) }
            "== bisect: App.xaml plus one page at a time"
            $pages = @($json.XamlPages)
            "pages: $($pages.Count)"
            $orig = $json.XamlPages
            foreach ($pg in $pages) {
              $json.XamlPages = @($pg)
              $json | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $in.DirectoryName 'bisect-input.json')
              & $xc.FullName (Join-Path $in.DirectoryName 'bisect-input.json') (Join-Path $in.DirectoryName 'bisect-output.json') 2>&1 | Out-Null
              "{0} -> exit {1}" -f ($pg | ConvertTo-Json -Compress -Depth 3), $LASTEXITCODE
            }
          } else { "no input.json found" }
      - name: Prove preview data is not in Release
        run: |
          $dll = Get-ChildItem artifacts/publish-${{ matrix.rid }} -Filter TaifaMail.dll | Select-Object -First 1
          $bytes = [IO.File]::ReadAllBytes($dll.FullName)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $utf16 = [Text.Encoding]::Unicode.GetString($bytes)
          $hits = @()
          foreach ($needle in 'PreviewBoot', 'PreviewData', 'PreviewMail', 'PreviewAuth') { if ($ascii.Contains($needle)) { $hits += $needle } }
          foreach ($needle in 'TAIFA_PREVIEW_FIXTURE_ONLY_DEBUG', '--preview-data', '--screenshots') { if ($utf16.Contains($needle)) { $hits += $needle } }
          if ($hits.Count -gt 0) { Write-Error "Preview data found in the Release build: $($hits -join ', ')"; exit 1 }
          Write-Host "Release assembly $($dll.Name) ($($dll.Length) bytes) contains none of the preview markers."
      - name: Zip
        run: Compress-Archive -Path artifacts/publish-${{ matrix.rid }}/* -DestinationPath artifacts/TaifaMail-windows-${{ matrix.rid }}-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TaifaMail-windows-${{ matrix.rid }}-unsigned
          path: windows/artifacts/TaifaMail-windows-${{ matrix.rid }}-unsigned.zip
          retention-days: 14

  ui-smoke:
    name: UI smoke and screenshots
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Debug x64 (the only build that contains preview data)
        run: dotnet build src/TaifaMail.App/TaifaMail.App.csproj -c Debug -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/debug-x64
      - name: Show XAML compiler diagnostics
        if: failure()
        run: |
          Get-ChildItem -Recurse src/TaifaMail.App/obj -Filter output.json | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Raw }
          $in = Get-ChildItem -Recurse src/TaifaMail.App/obj -Filter input.json | Select-Object -First 1
          if ($in) {
            $xc = Get-ChildItem "$env:USERPROFILE/.nuget/packages/microsoft.windowsappsdk/1.6.250108002/tools/net472" -Filter XamlCompiler.exe | Select-Object -First 1
            "== manual run of $($xc.FullName) on $($in.FullName)"
            & $xc.FullName $in.FullName (Join-Path $in.DirectoryName 'manual-output.json') 2>&1 | Out-String | Write-Host
            "exit $LASTEXITCODE"
            Get-ChildItem $in.DirectoryName -Filter *output.json | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Raw }
          } else { "no input.json found" }
      - name: Prove preview data is in Debug
        run: |
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path artifacts/debug-x64/TaifaMail.dll))
          if (-not [Text.Encoding]::Unicode.GetString($bytes).Contains('TAIFA_PREVIEW_FIXTURE_ONLY_DEBUG')) { Write-Error 'Debug build is missing the preview fixtures'; exit 1 }
      - name: Show display
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [Windows.Forms.Screen]::AllScreens | ForEach-Object { "$($_.DeviceName) $($_.Bounds)" }
      - name: Walk every screen and state
        run: |
          $out = Join-Path (Get-Location).Path 'artifacts/screenshots'
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath artifacts/debug-x64/TaifaMail.exe -ArgumentList '--preview-data', '--screenshots', $out -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill(); Write-Error 'The app did not finish the walk in time'; exit 1 }
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path "$out/FAILED.txt") { Get-Content "$out/FAILED.txt"; exit 1 }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Check the screenshots are real
        run: |
          Add-Type -AssemblyName System.Drawing
          $files = Get-ChildItem artifacts/screenshots -Filter *.png
          Write-Host "screenshots: $($files.Count)"
          if ($files.Count -lt 20) { Write-Error "expected 20 screenshots, found $($files.Count)"; exit 1 }
          foreach ($f in $files) {
            $bmp = [Drawing.Bitmap]::FromFile($f.FullName)
            $seen = New-Object 'System.Collections.Generic.HashSet[int]'
            for ($i = 0; $i -lt 4000; $i++) { [void]$seen.Add($bmp.GetPixel(($i * 37) % $bmp.Width, ($i * 91) % $bmp.Height).ToArgb()) }
            Write-Host ("{0,-48} {1}x{2} colors={3}" -f $f.Name, $bmp.Width, $bmp.Height, $seen.Count)
            $bmp.Dispose()
            if ($seen.Count -lt 12) { Write-Error "$($f.Name) looks blank"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: windows/artifacts/screenshots
          retention-days: 14
