name: Release

# Cutting a release: add an entry to the top of changelog.json, then run
# `make release` (or `npm run release`). That pushes a v<version> tag, which
# triggers this workflow to build the installers for every platform and publish
# them to GitHub Releases. electron-updater reads the feed straight from
# Releases (build.publish is provider: github), so there is nothing else to sync.
#
# NOTE ON TAGS: this repo is standalone, so `v*.*.*` is safe. If this ever moves
# into the taifa-mail monorepo, the tag MUST become `desktop-v*.*.*`
# (taifa-mail/.github/workflows/release.yml already fires on `v*` and both would
# race). That change is TWO-PART: electron-updater's GitHubProvider derives the
# version by stripping a leading `v` and semver-parsing the rest, so it cannot
# cope with a `desktop-v` prefix. Renaming the tag prefix REQUIRES switching
# build.publish to `provider: generic` in the same commit. Doing one without the
# other ships a build whose updater silently never finds an update.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# Point both caches inside the workspace so one `path:` list works on all three
# runners, with no per-OS branching between ~/.cache and %LOCALAPPDATA%.
env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--mac --x64 --arm64'
          - os: windows-latest
            args: '--win'
          - os: ubuntu-latest
            args: '--linux'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cache the downloaded Electron binaries and electron-builder's tooling.
      # Keyed on the lockfile because that is what pins the Electron version.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        # npm install, not npm ci: the lockfile is resolved on one OS and omits
        # electron-builder's other-platform optional deps, which makes npm ci
        # fail the strict lock check on every runner.
        run: npm install --no-audit --no-fund

      - name: Security and OIDC regression tests
        run: npm test

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Validate macOS release credentials
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for credential in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!credential}" ]; then
              echo "::error::Missing required macOS release credential: $credential"
              exit 1
            fi
          done

      # macOS: build + code-sign + notarize. The signing env (CSC_LINK etc.) is
      # ONLY set here; passing an empty CSC_LINK to Windows/Linux makes
      # electron-builder treat it as a bad cert path, so they get their own step.
      - name: Build and package (macOS, signed + notarized)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: YAD95QLFD7

      - name: Build and package (Windows / Linux)
        if: matrix.os != 'macos-latest'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release body comes from changelog.json, not from GitHub's default
      # auto-generated notes: that default is a list of commit subjects, which
      # is not what a user should be reading in the update dialog.
      #
      # ONE leg writes it, not all three. All three legs upload to the SAME
      # release, but action-gh-release only overwrites the body when the run
      # actually passes one (it falls back to the existing body otherwise), so
      # the mac and Windows legs cannot blank out what Linux wrote. Having all
      # three render identical Markdown and race to PATCH the same field would
      # be three writes to do one job, with the result depending on who finishes
      # last. Linux is the leg to pick: it is the cheapest runner, it needs no
      # signing secrets, and it already has Node set up.
      - name: Render the release notes from changelog.json
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # We build with --publish never and upload explicitly: electron-builder's
      # own publisher races across the three runners and can clobber latest*.yml.
      - name: Publish installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Empty on the other two legs, which leaves the existing body alone.
          # RELEASE_NOTES.md only exists on the leg that rendered it, and a
          # body_path pointing at a missing file would fail the step.
          body_path: ${{ matrix.os == 'ubuntu-latest' && 'RELEASE_NOTES.md' || '' }}
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          fail_on_unmatched_files: false
