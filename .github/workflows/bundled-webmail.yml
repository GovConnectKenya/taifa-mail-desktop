name: Bundled webmail build

# Branch check for the bundled-webmail app (docs/BUNDLED_WEBMAIL.md): builds the
# webmail desktop bundle from the private taifa-mail repo, stages it into
# renderer/ and packages the app on macOS and Windows runners. Never a release:
# nothing is signed, notarized, tagged or published. The installers are kept as
# workflow artifacts for inspection only.

on:
  push:
    branches: [feat/bundled-webmail]
  workflow_dispatch:
    inputs:
      webmail_ref:
        description: taifa-mail branch, tag or commit to bundle
        required: false
        default: feat/webmail-desktop-build

permissions:
  contents: read

concurrency:
  group: bundled-webmail-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  # Unsigned on purpose: no certificate is looked up even if one were present.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Package ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--mac --arm64 -c.mac.notarize=false'
            files: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            args: '--win'
            files: |
              release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The UI is built from GovConnectKenya/taifa-mail, which is private. The
      # job stops here, with this message, rather than packaging an app without
      # its UI. See RELEASING.md, One-time setup.
      - name: Require the taifa-mail read token
        shell: bash
        env:
          TOKEN: ${{ secrets.TAIFA_MAIL_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=TAIFA_MAIL_READ_TOKEN missing::Add a read-only token for GovConnectKenya/taifa-mail as the TAIFA_MAIL_READ_TOKEN secret (see RELEASING.md). The app's UI is built from that private repo."
            exit 1
          fi

      - name: Check out the webmail (taifa-mail)
        uses: actions/checkout@v4
        with:
          repository: GovConnectKenya/taifa-mail
          ref: ${{ inputs.webmail_ref || 'feat/webmail-desktop-build' }}
          token: ${{ secrets.TAIFA_MAIL_READ_TOKEN }}
          path: taifa-mail

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Build the webmail desktop bundle into renderer/
        run: node scripts/stage-webmail.mjs --build
        env:
          TAIFA_MAIL_DIR: taifa-mail

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package (unsigned, not published)
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload the unsigned installers
        uses: actions/upload-artifact@v4
        with:
          name: taifa-mail-${{ runner.os }}-unsigned
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
